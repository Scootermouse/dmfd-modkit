; A mod for the DMFD mod loader (winmm.dll). The loader starts dll= when the game opens.
[mod]
name=Skip Quit Confirmation
version=1.1
author=Scootermouse
description=Alt+F4 or the window's X closes the game right away, without the "really quit?" dialog. Can be switched off in game.
dll=SkipQuit.dll
; works in any online room: it only changes your own game
online=any
enabled=1
