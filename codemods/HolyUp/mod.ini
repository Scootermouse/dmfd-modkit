; A mod for the DMFD mod loader (winmm.dll). The loader starts dll= when the game opens.
[mod]
name=Holy Up
version=0.14
author=Scootermouse
description=Empress's Holy shots mark enemies. Each stack lowers their PIE and raises the Holy damage they take from the whole party. More PIE, more stacks. Both effects adjustable in game.
dll=HolyUp.dll
; changes damage everyone deals, so everyone in the room needs it
online=same
enabled=1
